name: SportOS — contrôles avant publication
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tester syntaxe, confidentialité et non-régression
        run: |
          npm run verify
          bash -n scripts/publier-v0.2-cloud-shell.sh
          bash -n scripts/publier-v0.3-cloud-shell.sh

  visual:
    name: Navigateur et captures responsive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester les 6 formats et les boutons
        run: node tests/visual-qa.cjs
      - name: Joindre les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportos-v0.3-visual-qa
          path: artifacts/v0.3/*.png
          if-no-files-found: ignore
