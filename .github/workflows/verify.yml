name: SportOS — contrôles avant publication
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tester syntaxe, confidentialité et non-régression
        run: |\n          npm run verify\n          bash -n scripts/publier-v0.2-cloud-shell.sh
