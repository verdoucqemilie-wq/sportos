/* ==== SportOS v0.3 | Athletic Editorial Design System =====================
   Scope: shell + home. Other pages retain their current content and controls.
   No third-party assets, fonts, APIs or trackers. ======================== */
:root{

  --v3-paper:#fff;--v3-acid:#d4f17b;--v3-sage:#e4ebe1;
  --v3-sand:#ede6db;--v3-muted:#58635d;--v3-line:#dee3dc;
  --v3-ff:"Arial Narrow","Franklin Gothic Medium","Segoe UI",Arial,sans-serif
}
body.sport-v3{background:var(--v3-bone);color:var(--v3-ink);font-family:Inter,"Segoe UI",Arial,sans-serif}

.v3-skip{position:fixed;top:-100px;left:12px;z-index:999;padding:10px 16px;background:var(--v3-acid);color:var(--v3-ink);font-weight:800;border-radius:8px}

/* Gentle entrance: no never-ending effects or hover lifts on non-clickable cards. */
@keyframes so-home-reveal {
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes so-home-fill {
  from{transform:scaleX(0)}
  to{transform:scaleX(1)}
}
@keyframes so-home-path {
  from{stroke-dashoffset:900;opacity:.12}
  to{stroke-dashoffset:0;opacity:.55}
}
body.sport-v4 .v3-dashboard .v3-intro,
